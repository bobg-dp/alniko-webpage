name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install, build, and upload site
        uses: withastro/action@v6
        with:
          node-version: 22
          package-manager: npm
          # Custom domain (alniko.eu) serves the site at "/", not "/alniko-webpage".
          # configure-pages still reports the repo name as base_path for project Pages.
          build-cmd: npm run build -- --site "https://alniko.eu" --base "/"
      - name: Verify asset URLs are rooted for the custom domain
        run: |
          grep -q 'href="/_astro/' dist/index.html
          ! grep -q '/alniko-webpage/_astro/' dist/index.html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
